name: Bug melden
description: Meld een reproduceerbaar probleem in de publieke Dajo-client.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Plaats nooit wachtwoorden, tokens, privéservergegevens of gevoelige volledige logs in dit formulier.
  - type: input
    id: version
    attributes:
      label: Dajo-versie
      placeholder: 3.26.24-beta.1
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows 11 x64
        - Windows 10 x64
        - Anders
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Stappen om het probleem te reproduceren
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Verwacht resultaat
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Werkelijk resultaat
    validations:
      required: true
